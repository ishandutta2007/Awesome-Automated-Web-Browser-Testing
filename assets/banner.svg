<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .glow-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .float-badge {
        animation: float 6s ease-in-out infinite alternate;
      }
      .signal-line {
        stroke-dasharray: 8 6;
        animation: dash 15s linear infinite;
      }
      @keyframes pulse1 {
        0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.5; }
        100% { transform: scale(1.15) translate(40px, 20px); opacity: 0.9; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.4; }
        100% { transform: scale(0.85) translate(-30px, -20px); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid-pattern)" rx="16" />

  <!-- Animated Glowing Orbs (Strictly in Background) -->
  <circle cx="200" cy="120" r="180" fill="url(#glow-cyan)" class="glow-pulse-1" />
  <circle cx="1000" cy="280" r="220" fill="url(#glow-purple)" class="glow-pulse-2" />

  <!-- Background Connecting Dynamic Flowlines -->
  <path d="M 120 330 C 350 370, 850 320, 1080 340" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" class="signal-line" />
  <path d="M 150 70 C 400 40, 800 90, 1050 60" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" class="signal-line" />

  <!-- Dynamic Status Indicator Pills in Deep Background / Framing -->
  <g class="float-badge" transform="translate(80, 48)">
    <rect width="130" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="18" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">E2E TESTING</text>
  </g>

  <g class="float-badge" transform="translate(980, 48)">
    <rect width="145" height="28" rx="14" fill="#4c1d95" fill-opacity="0.3" stroke="#a855f7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="18" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">CLOUD GRIDS</text>
  </g>

  <!-- Foreground Content (Always on top & crisp) -->
  <g id="foreground-content" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5px">
      Automated Web Browser Testing
    </text>

    <!-- Subtitle -->
    <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="url(#sub-grad)" letter-spacing="0.2px">
      The Ultimate Curated Guide to Open-Source Frameworks, Cloud Grids &amp; Testing SaaS
    </text>

    <!-- Interactive-feel Feature Cards in Foreground -->
    <g transform="translate(180, 275)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <circle cx="26" cy="26" r="6" fill="#10b981" />
        <text x="44" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Open-Source Engines</text>
        <text x="44" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Playwright • Puppeteer • Cypress</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(295, 0)">
        <rect width="250" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <circle cx="26" cy="26" r="6" fill="#6366f1" />
        <text x="44" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Cloud Testing SaaS</text>
        <text x="44" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Real Devices • Parallel Sessions</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(590, 0)">
        <rect width="250" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <circle cx="26" cy="26" r="6" fill="#f59e0b" />
        <text x="44" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Scalable Infrastructure</text>
        <text x="44" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Selenium Grid • Moon • Selenoid</text>
      </g>
    </g>
  </g>
</svg>
